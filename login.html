<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForgeCV — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #6c63ff;
  --radius: 16px;
  --radius-sm: 10px;
  --font-display: 'Syne', sans-serif;
  --font-body: 'Inter', sans-serif;
  --transition: 0.2s ease;
}

[data-theme="dark"] {
  --bg: #0c0c12;
  --surface: rgba(22, 22, 32, 0.85);
  --surface-solid: #16161f;
  --border: rgba(255,255,255,0.08);
  --border-solid: #252530;
  --text: #ececf4;
  --text2: #9090a8;
  --text3: #5a5a72;
  --glow: rgba(108,99,255,0.15);
}

[data-theme="light"] {
  --bg: #f0f0f8;
  --surface: rgba(255,255,255,0.85);
  --surface-solid: #ffffff;
  --border: rgba(0,0,0,0.08);
  --border-solid: #e0e0ea;
  --text: #0c0c18;
  --text2: #5a5a72;
  --text3: #9090a8;
  --glow: rgba(108,99,255,0.1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px 40px;
  transition: background var(--transition), color var(--transition);
  position: relative;
  overflow: hidden;
}

/* background blobs */
.blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
}

.blob1 {
  width: 400px; height: 400px;
  background: rgba(108,99,255,0.12);
  top: -100px; left: -100px;
}

.blob2 {
  width: 350px; height: 350px;
  background: rgba(167,139,250,0.08);
  bottom: -80px; right: -80px;
}

[data-theme="light"] .blob1 { background: rgba(108,99,255,0.08); }
[data-theme="light"] .blob2 { background: rgba(167,139,250,0.06); }

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 6%; height: 56px;
  background: var(--bg);
  border-bottom: 1px solid var(--border-solid);
  z-index: 10;
  transition: background var(--transition);
}

.logo {
  font-family: var(--font-display);
  font-size: 1.1rem; font-weight: 800;
  color: var(--text); text-decoration: none;
  letter-spacing: -0.5px;
}

.logo span { color: var(--accent); }

.theme-btn {
  width: 34px; height: 34px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-solid);
  background: var(--surface-solid);
  color: var(--text2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem;
  transition: border-color var(--transition);
}

.theme-btn:hover { border-color: var(--accent); }

/* ── MAIN ── */
.main {
  position: relative; z-index: 1;
  width: 100%; max-width: 400px;
  display: flex; flex-direction: column;
  align-items: center;
  gap: 20px;
  animation: fadeUp 0.4s ease both;
}

/* ── CARD ── */
.card {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px 28px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.25), 0 0 0 1px var(--border);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ── CARD HEADER ── */
.card-header { text-align: center; margin-bottom: 4px; }

.card-title {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -1px;
  margin-bottom: 4px;
}

.card-sub {
  font-size: 0.82rem;
  color: var(--text2);
  font-weight: 300;
}

/* ── GOOGLE BTN ── */
.google-btn {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; width: 100%;
  background: var(--surface-solid);
  border: 1px solid var(--border-solid);
  border-radius: var(--radius-sm);
  padding: 12px;
  font-family: var(--font-body);
  font-size: 0.9rem; font-weight: 500;
  color: var(--text); cursor: pointer;
  transition: border-color var(--transition), background var(--transition);
}

.google-btn:hover { border-color: var(--accent); }
.google-btn svg { width: 17px; height: 17px; flex-shrink: 0; }

/* ── DIVIDER ── */
.or-divider { display: flex; align-items: center; gap: 10px; }
.or-line { flex: 1; height: 1px; background: var(--border-solid); }
.or-text { font-size: 0.72rem; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; }

/* ── FIELD ── */
.field { display: flex; flex-direction: column; gap: 5px; }

.field label {
  font-size: 0.74rem;
  color: var(--text2); font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.5px;
}

.input-wrap { position: relative; }

.input-wrap input {
  width: 100%;
  background: var(--surface-solid);
  border: 1.5px solid var(--border-solid);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.9rem; outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}

.input-wrap input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(108,99,255,0.1);
}

.input-wrap input.valid { border-color: #34d399; }
.input-wrap input.error { border-color: #ff6b6b; }

.toggle-pass {
  position: absolute; right: 12px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none;
  color: var(--text3); cursor: pointer;
  font-size: 0.78rem; padding: 0;
  font-family: var(--font-body);
}

.field-err { font-size: 0.72rem; color: #ff6b6b; display: none; }
.field-err.show { display: block; }

/* ── REMEMBER + FORGOT ── */
.form-meta {
  display: flex; align-items: center;
  justify-content: space-between;
}

.remember {
  display: flex; align-items: center; gap: 7px;
  font-size: 0.8rem; color: var(--text2); cursor: pointer;
}

.remember input[type="checkbox"] {
  width: 15px; height: 15px;
  accent-color: var(--accent);
  cursor: pointer;
}

.forgot-link {
  font-size: 0.8rem; color: var(--text2);
  text-decoration: none;
  transition: color var(--transition);
}

.forgot-link:hover { color: var(--accent); }

/* ── BTN ── */
.btn-primary {
  width: 100%;
  background: var(--accent);
  color: #fff; border: none;
  border-radius: var(--radius-sm);
  padding: 13px;
  font-family: var(--font-display);
  font-size: 0.95rem; font-weight: 700;
  cursor: pointer;
  transition: opacity var(--transition), transform var(--transition);
  position: relative; overflow: hidden;
  letter-spacing: 0.2px;
}

.btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-primary.loading { pointer-events: none; }
.btn-primary .btn-text { transition: opacity 0.2s; }
.btn-spinner { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; }
.btn-primary.loading .btn-text { opacity: 0; }
.btn-primary.loading .btn-spinner { display: flex; }

@keyframes spin { to { transform: rotate(360deg); } }
.spinner-ring {
  width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

/* ── REGISTER LINK ── */
.register-link {
  font-size: 0.82rem; color: var(--text2); text-align: center;
}

.register-link a { color: var(--accent); text-decoration: none; font-weight: 500; }
.register-link a:hover { text-decoration: underline; }

/* ── FORGOT MODAL ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); z-index: 200;
  align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(4px);
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface-solid);
  border: 1px solid var(--border-solid);
  border-radius: var(--radius);
  padding: 28px 24px;
  max-width: 360px; width: 100%;
  position: relative;
  animation: fadeUp 0.3s ease both;
}

.modal-close {
  position: absolute; top: 12px; right: 14px;
  background: none; border: none;
  color: var(--text3); cursor: pointer; font-size: 1rem;
}

.modal-title {
  font-family: var(--font-display);
  font-size: 1.1rem; font-weight: 800;
  margin-bottom: 6px;
}

.modal-sub { color: var(--text2); font-size: 0.82rem; margin-bottom: 16px; line-height: 1.6; }

.modal-input {
  width: 100%;
  background: var(--surface-solid);
  border: 1.5px solid var(--border-solid);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.9rem; outline: none; margin-bottom: 12px;
  transition: border-color var(--transition);
}

.modal-input:focus { border-color: var(--accent); }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--surface-solid); border: 1px solid var(--border-solid);
  border-radius: var(--radius-sm);
  padding: 10px 20px; font-size: 0.82rem; color: var(--text);
  z-index: 300; transition: transform 0.3s; white-space: nowrap;
}

.toast.show { transform: translateX(-50%) translateY(0); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 400px) {
  .card { padding: 24px 18px; }
}
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>

<!-- NAV -->
<nav>
  <a href="index.html" class="logo">Forge<span>CV</span></a>
  <button class="theme-btn" id="theme-btn"><span id="theme-icon">☀</span></button>
</nav>

<div class="main">

  <!-- CARD -->
  <div class="card">

    <div class="card-header">
      <div class="card-title">Welcome back</div>
      <div class="card-sub">Sign in to continue building</div>
    </div>

    <!-- Google -->
    <button class="google-btn" onclick="showToast('Google sign in coming soon')">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div class="or-divider">
      <div class="or-line"></div>
      <div class="or-text">or</div>
      <div class="or-line"></div>
    </div>

    <!-- Email -->
    <div class="field">
      <label>Email</label>
      <div class="input-wrap">
        <input type="email" id="email" placeholder="you@example.com" oninput="validateEmail(this)" autocomplete="email">
      </div>
      <div class="field-err" id="email-err">Enter a valid email</div>
    </div>

    <!-- Password -->
    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password" style="padding-right:52px;">
        <button class="toggle-pass" onclick="togglePass()">show</button>
      </div>
      <div class="field-err" id="password-err">Enter your password</div>
    </div>

    <!-- Meta -->
    <div class="form-meta">
      <label class="remember">
        <input type="checkbox" id="remember"> Remember me
      </label>
      <a href="#" class="forgot-link" onclick="openForgot(event)">Forgot password?</a>
    </div>

    <!-- Submit -->
    <button class="btn-primary" id="login-btn" onclick="handleLogin()">
      <span class="btn-text">Sign in</span>
      <div class="btn-spinner"><div class="spinner-ring"></div></div>
    </button>

    <div class="register-link">
      Don't have an account? <a href="signup.html">Register</a>
    </div>

  </div>

</div>

<!-- FORGOT MODAL -->
<div class="modal-overlay" id="forgot-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeForgot()">✕</button>
    <div class="modal-title">Reset password</div>
    <p class="modal-sub">Enter your email and we'll send you a reset link.</p>
    <input class="modal-input" type="email" id="forgot-email" placeholder="you@example.com">
    <button class="btn-primary" onclick="sendReset()">
      <span class="btn-text">Send reset link</span>
      <div class="btn-spinner"><div class="spinner-ring"></div></div>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── THEME ──
const html = document.documentElement;
document.getElementById('theme-btn').addEventListener('click', () => {
  const t = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', t);
  document.getElementById('theme-icon').textContent = t === 'dark' ? '☀' : '☾';
  localStorage.setItem('sf-theme', t);
});
const saved = localStorage.getItem('sf-theme');
if (saved) {
  html.setAttribute('data-theme', saved);
  document.getElementById('theme-icon').textContent = saved === 'dark' ? '☀' : '☾';
}

// ── VALIDATION ──
function validateEmail(input) {
  const err = document.getElementById('email-err');
  const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value);
  if (input.value && !valid) { input.classList.add('error'); input.classList.remove('valid'); err.classList.add('show'); }
  else if (valid) { input.classList.remove('error'); input.classList.add('valid'); err.classList.remove('show'); }
}

function togglePass() {
  const input = document.getElementById('password');
  const btn = document.querySelector('.toggle-pass');
  if (input.type === 'password') { input.type = 'text'; btn.textContent = 'hide'; }
  else { input.type = 'password'; btn.textContent = 'show'; }
}

// ── LOGIN ──
function handleLogin() {
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const passErr = document.getElementById('password-err');

  validateEmail(email);
  if (!email.classList.contains('valid')) { showToast('Enter a valid email'); return; }
  if (!password.value) { password.classList.add('error'); passErr.classList.add('show'); showToast('Enter your password'); return; }

  password.classList.remove('error'); passErr.classList.remove('show');

  const btn = document.getElementById('login-btn');
  btn.classList.add('loading');
  setTimeout(() => {
    btn.classList.remove('loading');
    showToast('Signed in successfully');
    setTimeout(() => { window.location.href = 'index.html#builder'; }, 900);
  }, 1600);
}

// ── FORGOT ──
function openForgot(e) { e.preventDefault(); document.getElementById('forgot-modal').classList.add('open'); }
function closeForgot() { document.getElementById('forgot-modal').classList.remove('open'); }

function sendReset() {
  const email = document.getElementById('forgot-email').value;
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('Enter a valid email'); return; }
  closeForgot();
  showToast('Reset link sent — check your inbox');
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') handleLogin();
  if (e.key === 'Escape') closeForgot();
});
</script>
</body>
</html>
